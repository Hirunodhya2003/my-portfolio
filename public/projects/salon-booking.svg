<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg4)" />
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />

  <g transform="translate(30, 45)">
    <rect width="10" height="24" rx="3" fill="#a855f7" />
    <text x="20" y="18" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Salon Booking System</text>
    <text x="20" y="38" fill="#c084fc" font-family="monospace" font-size="12">Spring Cloud Gateway &#8226; Netflix Eureka &#8226; JWT Auth &#8226; React (Vite)</text>
  </g>

  <!-- Microservices Grid -->
  <g transform="translate(30, 110)">
    <!-- API Gateway -->
    <rect x="0" y="0" width="210" height="130" rx="10" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
    <text x="105" y="38" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold">Spring Cloud Gateway</text>
    <text x="105" y="65" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">JWT Authentication &amp; RBAC</text>
    <text x="105" y="90" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Dynamic Route Forwarding</text>

    <!-- Eureka Registry -->
    <rect x="240" y="0" width="240" height="130" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
    <text x="360" y="38" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold">Eureka Service Registry</text>
    <text x="360" y="65" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Service Discovery &amp; Heartbeats</text>
    <text x="360" y="90" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Client-side Load Balancing</text>

    <!-- Microservices Nodes -->
    <rect x="510" y="0" width="230" height="130" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="625" y="38" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">Independent Services</text>
    <text x="625" y="65" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">User &#8226; Salon &#8226; Booking &#8226; Payment</text>
    <text x="625" y="90" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">MySQL Isolated Schemas</text>
  </g>

  <!-- Summary info box -->
  <g transform="translate(30, 265)">
    <rect width="740" height="145" rx="12" fill="#0d1124" stroke="#1e293b" />
    <text x="24" y="30" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">&gt; Microservices Architecture Highlights:</text>
    <g transform="translate(24, 55)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
      <text y="15">&#8226; Decoupled microservices architecture ensuring high modularity and fault isolation.</text>
      <text y="40">&#8226; Spring Cloud Gateway handles centralized JWT verification and route distribution.</text>
      <text y="65">&#8226; Reactive Vite + React frontend communicating seamlessly through the gateway.</text>
    </g>
  </g>
</svg>