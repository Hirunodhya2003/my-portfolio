<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg1)" />
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Title bar -->
  <g transform="translate(30, 45)">
    <rect width="10" height="24" rx="3" fill="#06b6d4" />
    <text x="20" y="18" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Employee Management DevOps Pipeline</text>
    <text x="20" y="38" fill="#94a3b8" font-family="monospace" font-size="12">Jenkins CI/CD &#8226; Docker Compose &#8226; AWS EC2 &#8226; Prometheus &amp; Grafana</text>
  </g>

  <!-- Flow Steps -->
  <g transform="translate(30, 120)">
    <!-- Step 1: GitHub -->
    <rect x="0" y="0" width="125" height="95" rx="10" fill="#111c30" stroke="#f59e0b" stroke-width="1.5" />
    <text x="62" y="38" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold">GitHub</text>
    <text x="62" y="58" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Webhook Trigger</text>
    <text x="62" y="76" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Push event</text>

    <!-- Arrow 1 -->
    <path d="M 130 47 L 150 47" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 2: Jenkins -->
    <rect x="155" y="0" width="125" height="95" rx="10" fill="#111c30" stroke="#06b6d4" stroke-width="1.5" />
    <text x="217" y="38" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="bold">Jenkins CI</text>
    <text x="217" y="58" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Test &amp; Build</text>
    <text x="217" y="76" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Maven &amp; Vite</text>

    <!-- Arrow 2 -->
    <path d="M 285 47 L 305 47" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 3: Docker -->
    <rect x="310" y="0" width="125" height="95" rx="10" fill="#111c30" stroke="#3b82f6" stroke-width="1.5" />
    <text x="372" y="38" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="bold">Docker Hub</text>
    <text x="372" y="58" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Images Build</text>
    <text x="372" y="76" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Multi-stage</text>

    <!-- Arrow 3 -->
    <path d="M 440 47 L 460 47" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 4: AWS EC2 -->
    <rect x="465" y="0" width="135" height="95" rx="10" fill="#111c30" stroke="#14b8a6" stroke-width="1.5" />
    <text x="532" y="35" text-anchor="middle" fill="#2dd4bf" font-family="monospace" font-size="13" font-weight="bold">AWS EC2</text>
    <text x="532" y="55" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Docker Compose</text>
    <text x="532" y="74" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">Nginx &amp; MySQL 8.4</text>

    <!-- Arrow 4 -->
    <path d="M 605 47 L 620 47" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 5: Prometheus & Grafana -->
    <rect x="625" y="0" width="115" height="95" rx="10" fill="#111c30" stroke="#10b981" stroke-width="1.5" />
    <text x="682" y="38" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Telemetry</text>
    <text x="682" y="58" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Prometheus</text>
    <text x="682" y="76" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">&amp; Grafana</text>
  </g>

  <!-- Telemetry Highlights Box -->
  <g transform="translate(30, 245)">
    <rect width="740" height="170" rx="12" fill="#0b1324" stroke="#1e293b" />
    <text x="24" y="32" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">&gt; Telemetry &amp; Architecture Details:</text>
    
    <g transform="translate(24, 52)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
      <text y="15">&#8226; Infrastructure Metrics: Host CPU, RAM, Disk, and Network telemetry scraped via Node Exporter.</text>
      <text y="40">&#8226; Application Metrics: Live JVM heap usage, latency, and request rates streamed via Spring Boot Actuator.</text>
      <text y="65">&#8226; Reverse Proxy &amp; Persistence: Nginx handles frontend &amp; API proxying; persistent volume safeguards MySQL data.</text>
      <text y="90">&#8226; Security: Credentials and secrets managed outside of Git using environment variables and Jenkins Credentials Store.</text>
    </g>
  </g>
</svg>