<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="20" fill="#070b14" />
  <rect x="10" y="10" width="780" height="430" rx="16" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="2" />
  <!-- Title bar -->
  <text x="40" y="50" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">CI/CD & Observability Architecture | Employee Management DevOps</text>
  <text x="40" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">Jenkins &bull; Docker Compose &bull; AWS EC2 &bull; Prometheus &bull; Grafana &bull; Spring Boot</text>
  
  <!-- Flow Blocks -->
  <g transform="translate(40, 120)">
    <!-- 1 GitHub -->
    <rect x="0" y="0" width="120" height="100" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
    <text x="60" y="45" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold">GitHub</text>
    <text x="60" y="68" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Webhook Push</text>

    <!-- Arrow 1 -->
    <path d="M125 50 L145 50" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 2 Jenkins -->
    <rect x="150" y="0" width="120" height="100" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
    <text x="210" y="45" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="13" font-weight="bold">Jenkins CI</text>
    <text x="210" y="68" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Test &amp; Package</text>

    <!-- Arrow 2 -->
    <path d="M275 50 L295 50" stroke="#38bdf8" stroke-width="2" />

    <!-- 3 Docker -->
    <rect x="300" y="0" width="120" height="100" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <text x="360" y="45" text-anchor="middle" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="bold">Docker Hub</text>
    <text x="360" y="68" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Images Build</text>

    <!-- Arrow 3 -->
    <path d="M425 50 L445 50" stroke="#38bdf8" stroke-width="2" />

    <!-- 4 AWS EC2 -->
    <rect x="450" y="0" width="130" height="100" rx="12" fill="#111827" stroke="#14b8a6" stroke-width="1.5" />
    <text x="515" y="40" text-anchor="middle" fill="#14b8a6" font-family="monospace" font-size="13" font-weight="bold">AWS EC2</text>
    <text x="515" y="60" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Docker Compose</text>
    <text x="515" y="78" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">Nginx + MySQL 8.4</text>

    <!-- Arrow 4 -->
    <path d="M585 50 L605 50" stroke="#38bdf8" stroke-width="2" />

    <!-- 5 Observability -->
    <rect x="610" y="0" width="110" height="100" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="665" y="45" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Prometheus</text>
    <text x="665" y="68" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">&amp; Grafana</text>
  </g>

  <!-- Metric Telemetry Box -->
  <g transform="translate(40, 260)">
    <rect width="720" height="150" rx="12" fill="#0d1322" stroke="#1e293b" />
    <text x="20" y="35" fill="#38bdf8" font-family="monospace" font-size="12">Live Telemetry Highlights:</text>
    <text x="20" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="12">&bull; Infrastructure Telemetry: Host CPU, RAM, and Disk metrics scraped via Node Exporter</text>
    <text x="20" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="12">&bull; App Telemetry: HTTP request latency, throughput, and JVM heap via Spring Boot Actuator</text>
    <text x="20" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="12">&bull; Security: Zero hardcoded secrets &bull; Jenkins credentials store &bull; Docker volumes for persistence</text>
  </g>
</svg>