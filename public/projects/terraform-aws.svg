<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#13102b" />
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg2)" />
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 45)">
    <rect width="10" height="24" rx="3" fill="#8b5cf6" />
    <text x="20" y="18" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Terraform AWS Three-Tier Architecture</text>
    <text x="20" y="38" fill="#c084fc" font-family="monospace" font-size="12">VPC 10.0.0.0/16 &#8226; Multi-AZ (eu-north-1) &#8226; ALB &#8226; Private EC2 &#8226; Private RDS MySQL</text>
  </g>

  <!-- Big VPC Box -->
  <g transform="translate(30, 105)">
    <rect width="740" height="310" rx="12" fill="#0a0f1d" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="20" y="25" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">AWS VPC: 10.0.0.0/16 (eu-north-1a / eu-north-1b)</text>

    <!-- Tier 1: Public Web Subnets -->
    <rect x="20" y="42" width="210" height="245" rx="10" fill="#111827" stroke="#0284c7" />
    <text x="35" y="68" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Public Subnets</text>
    <text x="35" y="88" fill="#64748b" font-family="sans-serif" font-size="11">Internet Facing</text>

    <rect x="35" y="110" width="180" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" />
    <text x="125" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Application LB</text>
    <text x="125" y="168" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Ports 80 / 443</text>

    <path d="M 235 150 L 265 150" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow2)" />

    <!-- Tier 2: Private App Subnets -->
    <rect x="270" y="42" width="220" height="245" rx="10" fill="#111827" stroke="#8b5cf6" />
    <text x="285" y="68" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">Private App Subnets</text>
    <text x="285" y="88" fill="#64748b" font-family="sans-serif" font-size="11">Chained Security Group</text>

    <rect x="285" y="110" width="190" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" />
    <text x="380" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">EC2 App Instances</text>
    <text x="380" y="168" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Spring Boot APIs</text>

    <text x="380" y="225" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="10">Ingress restricted to ALB SG only</text>

    <path d="M 495 150 L 525 150" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow2)" />

    <!-- Tier 3: Private Database Subnets -->
    <rect x="530" y="42" width="190" height="245" rx="10" fill="#111827" stroke="#10b981" />
    <text x="545" y="68" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Private DB Subnets</text>
    <text x="545" y="88" fill="#64748b" font-family="sans-serif" font-size="11">Non-Public Database</text>

    <rect x="545" y="110" width="160" height="80" rx="8" fill="#1e293b" stroke="#10b981" />
    <text x="625" y="145" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">RDS MySQL</text>
    <text x="625" y="168" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Port 3306 Ingress</text>

    <text x="625" y="225" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="10">Ingress restricted to EC2 SG only</text>
  </g>
</svg>