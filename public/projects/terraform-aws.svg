<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="20" fill="#070b14" />
  <rect x="10" y="10" width="780" height="430" rx="16" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="2" />
  <!-- Header -->
  <text x="40" y="50" fill="#c084fc" font-family="monospace" font-size="18" font-weight="bold">Terraform AWS Three-Tier High Availability Architecture</text>
  <text x="40" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">AWS VPC (10.0.0.0/16) &bull; eu-north-1 &bull; Public ALB &bull; Private EC2 &bull; Private RDS MySQL</text>

  <!-- VPC Container -->
  <rect x="40" y="100" width="720" height="310" rx="14" fill="#0c101d" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="60" y="125" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">AWS VPC: 10.0.0.0/16 (eu-north-1)</text>

  <!-- Tier 1 Public Subnets -->
  <rect x="60" y="145" width="190" height="240" rx="10" fill="#111827" stroke="#0284c7" />
  <text x="80" y="175" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Public Subnets</text>
  <text x="80" y="195" fill="#64748b" font-family="sans-serif" font-size="11">eu-north-1a / 1b</text>
  <rect x="80" y="215" width="150" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" />
  <text x="155" y="245" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Internet ALB</text>
  <text x="155" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Port 80/443</text>

  <!-- Security Group Arrow 1 -->
  <path d="M255 250 L295 250" stroke="#38bdf8" stroke-width="2" />
  <text x="275" y="240" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="9">SG HTTP</text>

  <!-- Tier 2 Private App Subnets -->
  <rect x="300" y="145" width="200" height="240" rx="10" fill="#111827" stroke="#2563eb" />
  <text x="320" y="175" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">Private App Subnets</text>
  <text x="320" y="195" fill="#64748b" font-family="sans-serif" font-size="11">Chained Security Group</text>
  <rect x="320" y="215" width="160" height="70" rx="8" fill="#1e293b" stroke="#60a5fa" />
  <text x="400" y="245" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">EC2 Instances</text>
  <text x="400" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Spring Boot / APIs</text>

  <!-- Security Group Arrow 2 -->
  <path d="M505 250 L545 250" stroke="#38bdf8" stroke-width="2" />
  <text x="525" y="240" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="9">SG 3306</text>

  <!-- Tier 3 Private DB Subnets -->
  <rect x="550" y="145" width="190" height="240" rx="10" fill="#111827" stroke="#10b981" />
  <text x="570" y="175" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">Private DB Subnets</text>
  <text x="570" y="195" fill="#64748b" font-family="sans-serif" font-size="11">Non-Public Database</text>
  <rect x="570" y="215" width="150" height="70" rx="8" fill="#1e293b" stroke="#10b981" />
  <text x="645" y="245" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">RDS MySQL</text>
  <text x="645" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Port 3306 Restricted</text>
</svg>