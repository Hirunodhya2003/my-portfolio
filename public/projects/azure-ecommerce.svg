<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0d1d36" />
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0078d4" />
    </marker>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg3)" />
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#0078d4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(30, 45)">
    <rect width="10" height="24" rx="3" fill="#0078d4" />
    <text x="20" y="18" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Azure Three-Tier E-Commerce Platform</text>
    <text x="20" y="38" fill="#38bdf8" font-family="monospace" font-size="12">Spring Boot CRUD &#8226; React Frontend &#8226; Docker &#8226; Azure Container Registry (ACR)</text>
  </g>

  <!-- Flow -->
  <g transform="translate(30, 115)">
    <!-- UI Tier -->
    <rect x="0" y="0" width="210" height="120" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="35" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">React Frontend</text>
    <text x="105" y="60" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">E-Commerce Storefront UI</text>
    <text x="105" y="85" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Vite &#8226; State Management</text>

    <!-- Arrow 1 -->
    <path d="M 215 60 L 260 60" stroke="#0078d4" stroke-width="2" marker-end="url(#arrow3)" />

    <!-- Backend Tier -->
    <rect x="265" y="0" width="230" height="120" rx="10" fill="#111827" stroke="#0078d4" stroke-width="1.5" />
    <text x="380" y="35" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold">Spring Boot REST API</text>
    <text x="380" y="60" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Product CRUD Microservices</text>
    <text x="380" y="85" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Java 17 &#8226; Actuator Metrics</text>

    <!-- Arrow 2 -->
    <path d="M 500 60 L 545 60" stroke="#0078d4" stroke-width="2" marker-end="url(#arrow3)" />

    <!-- Database Tier -->
    <rect x="550" y="0" width="190" height="120" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <text x="645" y="35" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">MySQL Database</text>
    <text x="645" y="60" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Persistent Data Tier</text>
    <text x="645" y="85" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Relational Schema</text>
  </g>

  <!-- Azure Cloud Box -->
  <g transform="translate(30, 265)">
    <rect width="740" height="145" rx="12" fill="#0b162c" stroke="#1e3a8a" />
    <text x="24" y="30" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">&gt; Azure Cloud Deployment &amp; Infrastructure:</text>
    <g transform="translate(24, 52)" font-family="sans-serif" font-size="12" fill="#cbd5e1">
      <text y="15">&#8226; Azure Container Registry (ACR): Docker images published and securely versioned in Azure registry.</text>
      <text y="40">&#8226; Monitoring &amp; Telemetry: Prometheus and Grafana integration for continuous application health tracking.</text>
      <text y="65">&#8226; CI/CD &amp; IaC: Terraform cloud provisioning and automated GitHub Actions delivery pipeline.</text>
    </g>
  </g>
</svg>